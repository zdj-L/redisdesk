name: Windows installer

on:
  push:
    tags:
      - "v*"
    branches:
      - publish-windows-installer
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: x64

      - name: Enable MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Create isolated .build-venv
        shell: pwsh
        run: |
          python -m venv .build-venv
          .\.build-venv\Scripts\python.exe -m pip install -U pip setuptools wheel
          .\.build-venv\Scripts\python.exe -m pip install -e .
          .\.build-venv\Scripts\python.exe -m pip install "nuitka==4.3.5" ordered-set zstandard

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build standalone with Nuitka
        shell: pwsh
        run: .\scripts\build_nuitka.ps1

      - name: Packaged smoke (isolated, no real Redis or SSH)
        shell: pwsh
        run: |
          $dist = "build\portable\portable_entry.dist"
          $exe = Join-Path $dist "RedisDesk.exe"
          if (-not (Test-Path $exe)) { throw "Standalone exe missing: $exe" }
          $report = Join-Path $env:RUNNER_TEMP "redisdesk-packaged-smoke.json"
          Remove-Item Env:QT_QPA_PLATFORM -ErrorAction SilentlyContinue
          function Invoke-PackagedSmoke([string]$ReportPath) {
            Push-Location $dist
            try {
              & ".\RedisDesk.exe" --smoke-test --smoke-report $ReportPath
              return $LASTEXITCODE
            } finally {
              Pop-Location
            }
          }
          $code = Invoke-PackagedSmoke $report
          if (Test-Path $report) { Get-Content $report }
          if ($code -ne 0) {
            $plugin = Get-ChildItem -Recurse $dist -Filter "qoffscreen.dll" -ErrorAction SilentlyContinue
            if ($plugin) {
              Write-Host "Retrying packaged smoke with QT_QPA_PLATFORM=offscreen"
              $env:QT_QPA_PLATFORM = "offscreen"
              $report = Join-Path $env:RUNNER_TEMP "redisdesk-packaged-smoke-offscreen.json"
              $code = Invoke-PackagedSmoke $report
              if (Test-Path $report) { Get-Content $report }
            }
          }
          if ($code -ne 0) { throw "Packaged smoke failed: $code" }
          if (-not (Test-Path $report)) { throw "Smoke report missing: $report" }
          $json = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $json.ok) { throw "Packaged smoke report ok is not true" }

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-smoke-report
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/redisdesk-packaged-smoke.json
            ${{ runner.temp }}/redisdesk-packaged-smoke-offscreen.json

      - name: Stage portable payload
        shell: pwsh
        env:
          REDISDESK_REFRESH_SOURCE_ALLOWLIST: "1"
        run: .\.build-venv\Scripts\python.exe scripts\stage_portable.py --refresh-allowlist

      - name: Build unsigned installer
        shell: pwsh
        run: |
          $staged = "release\RedisDesk-1.0.0-internal-win64-portable\RedisDesk.exe"
          if (-not (Test-Path $staged)) { throw "Staged exe missing: $staged" }
          $sha = (Get-FileHash -Algorithm SHA256 $staged).Hash.ToLower()
          Write-Host "STAGED_EXE_SHA256 $sha"
          .\scripts\build_installer.ps1 -ExpectedExeSha $sha

      - name: Write update manifest
        shell: pwsh
        run: |
          $setup = "release\RedisDesk-1.0.0-internal-win64-setup.exe"
          $version = (.\.build-venv\Scripts\python.exe -c "from redisdesk import __version__; print(__version__)").Trim()
          $notes = @"
          RedisDesk $version unsigned internal preview.

          This installer is not code-signed. Windows may warn about an unknown publisher. Do not bypass security prompts or disable antivirus.

          SHA-256 and file size are in latest.json and SHA256SUMS.txt. The in-app updater requires a SHA-256 match before launching setup.
          "@
          .\.build-venv\Scripts\python.exe scripts\write_update_manifest.py $setup --version $version --notes $notes.Trim()
          Get-Content release\latest.json
          Get-Content release\SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: redisdesk-windows-installer
          if-no-files-found: error
          path: |
            release/RedisDesk-*-internal-win64-setup.exe
            release/latest.json
            release/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/publish-windows-installer'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (.\.build-venv\Scripts\python.exe -c "from redisdesk import __version__; print(__version__)").Trim()
          $tag = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "v$version" }
          $setup = Get-Item "release\RedisDesk-*-internal-win64-setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "Installer missing" }
          $sha = (Get-FileHash -Algorithm SHA256 $setup.FullName).Hash.ToLower()
          $size = $setup.Length
          $body = @"
          RedisDesk $version internal preview (unsigned).

          This is an unsigned internal preview installer, not a stable release. Windows may warn about an unknown publisher. Do not bypass security prompts or disable antivirus. The in-app updater never treats this package as signed and will refuse to install if the SHA-256 check fails.

          **Installer:** $($setup.Name)
          **Size:** $size bytes
          **SHA-256:** $sha
          "@
          $files = @($setup.FullName, "release\latest.json", "release\SHA256SUMS.txt")
          $existing = $true
          gh release view $tag --repo ${{ github.repository }} 2>$null
          if ($LASTEXITCODE -ne 0) { $existing = $false }
          if ($existing) {
            gh release upload $tag --clobber --repo ${{ github.repository }} @files
            gh release edit $tag --repo ${{ github.repository }} --title "RedisDesk $tag (internal preview, unsigned)" --notes $body
          } else {
            gh release create $tag --repo ${{ github.repository }} --target $env:GITHUB_SHA --title "RedisDesk $tag (internal preview, unsigned)" --notes $body @files
          }
          Write-Host "RELEASE_TAG $tag"
          Write-Host "INSTALLER $($setup.Name)"
          Write-Host "INSTALLER_SIZE $size"
          Write-Host "INSTALLER_SHA256 $sha"
