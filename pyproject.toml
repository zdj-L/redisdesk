[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redisdesk"
version = "1.0.0"
description = "Windows 单机桌面 Redis 排查客户端（PySide6）"
requires-python = ">=3.11"
dependencies = [
    "PySide6-Essentials==6.8.2.1",
    "redis==5.2.1",
    "paramiko==3.5.1",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
packaging = ["nuitka>=2.7.15,<5", "ordered-set", "zstandard"]

[project.scripts]
redisdesk = "redisdesk.app.main:main"

[tool.setuptools]
packages = [
    "redisdesk",
    "redisdesk.app",
    "redisdesk.app.ui",
    "redisdesk.app.ui.pages",
    "redisdesk.app.services",
    "redisdesk.core",
    "redisdesk.adapters",
    "redisdesk.infra",
    "redisdesk.worker",
]

[tool.setuptools.package-data]
"redisdesk.app.ui" = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
